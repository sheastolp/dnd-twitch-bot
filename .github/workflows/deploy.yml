name: Deploy to Val Town

on:
  push:
    branches: [main]
  workflow_dispatch: {} # lets you manually trigger a deploy from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install vt CLI
        run: deno install -grAf jsr:@valtown/vt

      - name: Push to Val Town
        env:
          VAL_TOWN_API_KEY: ${{ secrets.VAL_TOWN_API_KEY }}
        run: vt push
