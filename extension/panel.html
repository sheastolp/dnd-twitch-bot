<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuildScribe</title>
  <link rel="stylesheet" href="ext.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="sheet panel">
    <div id="head"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-hero" aria-selected="true" data-tab="hero">My Hero</button>
      <button role="tab" id="tab-guild" aria-selected="false" data-tab="guild">The Guild</button>
    </nav>
    <div id="err" class="err hidden" role="status"></div>
    <div id="body" class="scroll" role="tabpanel" aria-live="polite">
      <div class="cta muted">Unrolling the scroll…</div>
    </div>
    <div class="foot">Play in chat · <code>!guide</code> for every command</div>
  </main>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="ext.js"></script>
  <script src="panel.js"></script>
</body>
</html>
